# ============================================================
#  SIGPROV - Servicios de desarrollo
# ============================================================
#  Uso:
#     docker compose up -d              # levanta postgres + backend
#     docker compose up -d postgres     # solo la base de datos
#     docker compose logs -f backend    # ver logs
#     docker compose down -v            # apagar y borrar el volumen
#
#  Las variables se leen del archivo .env de este mismo directorio.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigprov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SIGPROV_DB_NAME:-sigprov}
      POSTGRES_USER: ${SIGPROV_DB_USER:-sigprov}
      POSTGRES_PASSWORD: ${SIGPROV_DB_PASSWORD:-sigprod_dev_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${SIGPROV_DB_PORT:-5432}:5432"
    volumes:
      - sigprov_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGPROV_DB_USER:-sigprov} -d ${SIGPROV_DB_NAME:-sigprov}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigprov-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker el host de la DB es el nombre del servicio
      SIGPROV_DB_HOST: postgres
      SIGPROV_DB_PORT: 5432
      SIGPROV_DB_USER: ${SIGPROV_DB_USER:-sigprov}
      SIGPROV_DB_PASSWORD: ${SIGPROV_DB_PASSWORD:-sigprod_dev_2026}
      SIGPROV_DB_NAME: ${SIGPROV_DB_NAME:-sigprov}
      SIGPROV_SECRET_KEY: ${SIGPROV_SECRET_KEY:-clave_de_desarrollo_cambiar_en_produccion_0123456789}
      SIGPROV_ENVIRONMENT: ${SIGPROV_ENVIRONMENT:-local}
      SIGPROV_DEBUG: ${SIGPROV_DEBUG:-false}
      SIGPROV_CORS_ORIGINS: ${SIGPROV_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8000,file://}
    ports:
      - "8000:8000"
    volumes:
      # El codigo se monta para recargar sin reconstruir la imagen
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/sql:/app/sql
      - ./backend/migrations:/app/migrations
      - sigprov_models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  sigprov_pg_data:
    driver: local
  sigprov_models:
    driver: local
