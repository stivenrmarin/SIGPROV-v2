[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigprov-backend"
version = "2.0.0"
description = "SIGPROV - Inventario y prediccion de ventas para panaderias"
requires-python = ">=3.11"
readme = "README.md"

# ============================================================
#  Ruff - linter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests"]
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "ARG",  # unused arguments
    "PTH",  # pathlib
]
ignore = [
    "E501",    # la longitud la maneja black
    "B008",    # FastAPI Depends() en defaults es idiomatico
    "N803",    # Nombres de argumentos en camelCase (contrato de la API)
    "N806",    # variables en camelCase (datos de la DB)
    "ARG001",  #argumentos sin usar en stubs de FastAPI
    "SIM108",  # ternario vs if (legibilidad)
]

[tool.ruff.lint.per-file-ignores]
"app/schemas.py" = ["N815"]   # los schemas reflejan la BD
"scripts/*" = ["E402"]        # los scripts ajustan sys.path antes de importar app
"tests/*" = ["ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
#  Black - formateador
# ============================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    venv
  | \.venv
  | __pycache__
  | alembic/versions
)/
'''

# ============================================================
#  Mypy - analizador de tipos
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv/",
    "\\.venv/",
    "__pycache__/",
    "alembic/versions/",
]

[[tool.mypy.overrides]]
module = ["app.ml.*"]
# Prophet no trae stubs y usa Any en varios puntos
ignore_missing_imports = true
warn_return_any = false

# ============================================================
#  Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
